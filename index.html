<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台股 AI 分析儀表板</title>
<style>
:root{
--bg:#06101d;--card:#101d2d;--card2:#15263a;--text:#eef5ff;
--muted:#91a4b9;--line:#263b52;--blue:#42a5ff;
--green:#35d07f;--yellow:#ffd166;--red:#ff6678
}
*{box-sizing:border-box}
body{
margin:0;background:linear-gradient(180deg,#06101d,#0b1625);
color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif
}
.wrap{max-width:1100px;margin:auto;padding:20px 14px 50px}
.brand{font-size:25px;font-weight:900;margin-bottom:14px}
.search{display:flex;gap:8px}
input{
flex:1;background:#0d1a2a;border:1px solid var(--line);
border-radius:12px;color:#fff;padding:14px;font-size:17px;min-width:0
}
button{
border:0;border-radius:12px;background:var(--blue);color:#fff;
font-weight:800;padding:0 20px;font-size:16px
}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 0}
.chip{
background:#12243a;border:1px solid var(--line);color:#cfe1f5;
border-radius:999px;padding:7px 12px;white-space:nowrap
}
h1{font-size:30px;margin:20px 0 4px}
.sub{color:var(--muted);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{
background:rgba(16,29,45,.96);border:1px solid var(--line);
border-radius:17px;padding:17px
}
.wide{grid-column:1/-1}
.title{font-size:17px;font-weight:900;margin-bottom:13px}
.big{font-size:34px;font-weight:900}
.up{color:var(--green)}.down{color:var(--red)}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.kv div{background:#0c1928;border-radius:10px;padding:11px}
.kv b{display:block;font-size:18px;margin-top:4px}
.rows{display:grid;gap:5px}
.row{
display:flex;justify-content:space-between;gap:15px;
border-bottom:1px solid #203246;padding:10px 0
}
.tag{
display:inline-block;border-radius:8px;padding:4px 8px;
font-size:12px;font-weight:900;background:#18304a
}
.good{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}
.risk{
border:1px solid var(--yellow);
background:linear-gradient(180deg,#1c2a35,#13202c)
}
.risk.low{border-color:var(--green)}
.risk.high{border-color:var(--red)}
.risknum{font-size:42px;font-weight:900}
.notice{color:var(--muted);line-height:1.7}
.loading{text-align:center;padding:25px;color:var(--muted)}
.bar{height:10px;background:#091523;border-radius:20px;overflow:hidden}
.fill{height:100%;background:var(--blue)}
.small{font-size:13px;color:var(--muted)}
footer{margin-top:20px;color:#71859a;font-size:12px;line-height:1.6}
@media(max-width:700px){
.grid{grid-template-columns:1fr}.wide{grid-column:auto}
.search button{padding:0 15px}
}
</style>
</head>

<body>

資料為公開市場資料，可能有延遲或缺漏。

<script>

const $=id=>document.getElementById(id);

const names={
"2330":"台積電",
"2317":"鴻海",
"2327":"國巨",
"5351":"鈺創",
"2454":"聯發科",
"2303":"聯電",
"2382":"廣達",
"3231":"緯創",
"6669":"緯穎",
"2344":"華邦電",
"2408":"南亞科",
"3711":"日月光投控"
};

function pick(x){
$("q").value=x;
analyze();
}

function esc(x){
return String(x??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[m]));
}

function avg(a){
const nums=a.map(Number).filter(Number.isFinite);
if(!nums.length)return null;
return nums.reduce((x,y)=>x+y,0)/nums.length;
}

function ma(arr,n){
if(arr.length<n)return null;
return avg(arr.slice(-n));
}

function ema(arr,n){
if(arr.length<n)return null;
let k=2/(n+1);
let e=avg(arr.slice(0,n));
for(let i=n;i<arr.length;i++)e=arr[i]*k+e*(1-k);
return e;
}

function rsi(arr,n=14){
if(arr.length<=n)return null;
let gain=0,loss=0;
for(let i=arr.length-n;i<arr.length;i++){
let d=arr[i]-arr[i-1];
if(d>0)gain+=d;
else loss-=d;
}
if(loss===0)return 100;
let rs=(gain/n)/(loss/n);
return 100-(100/(1+rs));
}

function ema(arr,n){
if(arr.length<n)return null;

let e=avg(arr.slice(0,n));
const k=2/(n+1);

for(let i=n;i<arr.length;i++){
e=arr[i]*k+e*(1-k);
}

return e;
}

function macd(arr){
if(arr.length<35)return null;

const dif=[];

for(let i=0;i<arr.length;i++){
if(i<25)continue;

const e12=ema(arr.slice(0,i+1),12);
const e26=ema(arr.slice(0,i+1),26);

if(e12!=null&&e26!=null){
dif.push(e12-e26);
}
}

if(dif.length<9)return null;

const signal=ema(dif,9);
const line=dif.at(-1);

return{
line,
signal,
hist:line-signal
};
}

function kd(high,low,close,n=9){
  if(close.length<n)return null;

  let K=50,D=50;
  const start=Math.max(n-1,close.length-60);

  for(let i=start;i<close.length;i++){
    const hh=Math.max(...high.slice(i-n+1,i+1));
    const ll=Math.min(...low.slice(i-n+1,i+1));

    const rsv=hh===ll
      ?50
      :(close[i]-ll)/(hh-ll)*100;

    K=(2*K+rsv)/3;
    D=(2*D+K)/3;
  }

  return {
    k:K,
    d:D
  };
}
function fmt(x,d=2){
return x==null?"—":Number(x).toFixed(d);
}

function pct(x){
return x==null?"—":(x>=0?"+":"")+Number(x).toFixed(2)+"%";
}

function indicatorText(r,m,k,change,vr){
  let volumeText=
    change>0&&vr>=1.5
      ?"🟢 價漲量增｜放量上攻"
      :change>0&&vr>=1
      ?"🟢 價漲量增｜溫和放量"
      :change>0&&vr<0.4
      ?"🟡 價漲量縮｜量能很低"
      :change>0&&vr<0.7
      ?"🟡 價漲量縮｜量縮"
      :Math.abs(change)<0.5&&vr<0.4
      ?"⚪ 價平量縮｜極度量縮"
      :Math.abs(change)<0.5&&vr<0.7
      ?"🟡 價平量縮｜量縮整理"
      :change<0&&vr>=1.5
      ?"🔴 價跌量增｜放量下殺"
      :change<0&&vr<0.7
      ?"🔴 價跌量縮｜弱勢"
      :"🟡 量價正常";

  let rsiText=
    r==null
      ?"資料不足"
      :r>=70
      ?"🔴 過熱"
      :r>=50
      ?"🟢 偏強"
      :r>=30
      ?"🟡 偏弱"
      :"🔴 超弱／可能超賣";

  let macdText=
    m==null
      ?"資料不足"
      :m.line>m.signal
      ?"🟢 DIF > 訊號線"
      :"🔴 DIF < 訊號線";

  let kdText=
    k==null
      ?"資料不足"
      :k.k>=80
      ?"🔴 K高檔"
      :k.k<=20
      ?"🟡 K低檔"
      :k.k>k.d
      ?"🟢 K>D"
      :"🔴 K<D";

  return{
    volumeText,
    rsiText,
    macdText,
    kdText
  };
}
function drawKLine(open,high,low,close,volume){
const canvas=$("kline");
if(!canvas)return;
const rect=canvas.getBoundingClientRect();
const dpr=window.devicePixelRatio||1;
const w=Math.max(320,Math.floor(rect.width));
const h=Math.max(360,Math.floor(rect.height));

canvas.width=w*dpr;
canvas.height=h*dpr;

const ctx=canvas.getContext("2d");

ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,w,h);

const n=Math.min(70,close.length);
const start=close.length-n;

const C=close.slice(start);
const O=open.slice(start);
const H=high.slice(start);
const L=low.slice(start);
const V=volume.slice(start);

const top=18;
const bottom=52;
const volH=72;
const chartH=h-top-bottom-volH;

const maxP=Math.max(...H);
const minP=Math.min(...L);
const maxV=Math.max(...V,1);

const px=i=>
8+i*(w-16)/Math.max(n-1,1);

const py=p=>
top+(maxP-p)/(maxP-minP||1)*chartH;

const vy=v=>
top+chartH+(maxV-v)/maxV*volH;

ctx.strokeStyle="#263b52";
ctx.lineWidth=1;

for(let j=0;j<4;j++){

const y=top+j*chartH/3;

ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(w,y);
ctx.stroke();

}

function maline(period,label){

ctx.beginPath();

let started=false;

for(let i=0;i<n;i++){

const g=start+i;

if(g<period-1)continue;

const val=
avg(close.slice(g-period+1,g+1));

const x=px(i);
const y=py(val);

if(!started){
ctx.moveTo(x,y);
started=true;
}else{
ctx.lineTo(x,y);
}

}

ctx.strokeStyle=
label===5
?"#42a5ff":
label===10
?"#ffd166":
"#35d07f";

ctx.lineWidth=1.6;
ctx.stroke();

}

maline(5,5);
maline(10,10);
maline(20,20);

for(let i=0;i<n;i++){

const x=px(i);

const o=
O[i]??(i?C[i-1]:C[i]);

const cc=C[i];

const hi=H[i];
const lo=L[i];

const up=cc>=o;

ctx.strokeStyle=
up
?"#35d07f"
:"#ff6678";

ctx.fillStyle=ctx.strokeStyle;

ctx.beginPath();
ctx.moveTo(x,py(hi));
ctx.lineTo(x,py(lo));
ctx.stroke();

const bw=
Math.max(2,(w-16)/n*.58);

const bt=
py(Math.max(o,cc));

const bb=
py(Math.min(o,cc));

ctx.fillRect(
x-bw/2,
bt,
bw,
Math.max(1,bb-bt)
);

ctx.fillRect(
x-1,
vy(V[i]),
2,
h-bottom-vy(V[i])
);

}

ctx.font="12px sans-serif";

ctx.fillStyle="#91a4b9";
ctx.fillText("MA5",8,h-28);

ctx.fillStyle="#42a5ff";
ctx.fillText("●",38,h-28);

ctx.fillStyle="#91a4b9";
ctx.fillText("MA10",62,h-28);

ctx.fillStyle="#ffd166";
ctx.fillText("●",101,h-28);

ctx.fillStyle="#91a4b9";
ctx.fillText("MA20",125,h-28);

ctx.fillStyle="#35d07f";
ctx.fillText("●",164,h-28);

ctx.fillStyle="#91a4b9";
ctx.fillText("成交量",190,h-28);

}

async function getFundamentals(code){

const u=
"https://taiwan-stock-api.p337531.workers.dev/fundamentals?symbol="
+encodeURIComponent(code);

const r=await fetch(u);

if(!r.ok)return null;

return r.json();

}

async function analyze(){

let code=$("q").value.trim().toUpperCase();

if(!code){

$("status").textContent="請輸入股票代號";

return;

}

$("status").textContent=
"正在分析 "+code+"…";

$("app").innerHTML=
'<div class="card loading">⏳ 正在取得行情、基本面、籌碼與技術資料…</div>';

try{

let symbol=
code.endsWith(".TW")
?code
:code+".TW";

let [stock,market,fundamentals]=
await Promise.all([

getChart(symbol),

fetch(
"https://taiwan-stock-api.p337531.workers.dev/market"
)
.then(r=>{

if(!r.ok)
throw Error("大盤資料暫時無法取得");

return r.json();

}),

getFundamentals(code)

]);

let sr=stock.chart.result[0];
let mr=market.chart.result[0];

let quote=sr.indicators.quote[0];

let open=
(quote.open||[])
.filter(x=>x!=null);

let close=
(quote.close||[])
.filter(x=>x!=null);

let high=
(quote.high||[])
.filter(x=>x!=null);

let low=
(quote.low||[])
.filter(x=>x!=null);

let volume=
(quote.volume||[])
.filter(x=>x!=null);

let mclose=
(mr.indicators.quote[0].close||[])
.filter(x=>x!=null);

if(close.length<30)
throw Error("這檔股票目前取得的歷史資料不足");

let price=close.at(-1);
let prev=close.at(-2);

let change=
(price/prev-1)*100;

let ma5=ma(close,5);
let ma10=ma(close,10);
let ma20=ma(close,20);

let r=rsi(close);
let m=macd(close);
let k=kd(high,low,close);

let v=volume.at(-1);
let avgv=avg(volume.slice(-20));
let avg5v=avg(volume.slice(-5));
let volumeRatio20=avgv>0?v/avgv:null;
let volumeTrend=avgv>0?avg5v/avgv:null;

let marketNow=mclose.at(-1);
let marketPrev=mclose.at(-2);

let marketChange=
(marketNow/marketPrev-1)*100;

let marketMA10=
ma(mclose,10);

let stockVs10MA=
(price/ma10-1)*100;

let marketVs10MA=
(marketNow/marketMA10-1)*100;

let relative=
stockVs10MA-marketVs10MA;

let revData=
fundamentals?.revenue||null;

let valData=
fundamentals?.valuation||null;

let instData=
fundamentals?.institutions||null;

let revenueYoy=
revData?.yoy;

let revenueMom=
revData?.mom;

let instTotal=
instData?.total;

let revenueState=
revenueYoy==null
?"待資料":
revenueYoy>=15
?"🟢 明顯成長":
revenueYoy>0
?"🟢 成長":
revenueYoy>-10
?"🟡 小幅衰退":
"🔴 明顯衰退";

let chipState=
instTotal==null
?"待資料":
instTotal>0
?"🟢 法人合計買超":
instTotal<0
?"🔴 法人合計賣超":
"🟡 法人持平";

function findSupportResistance(
highs,
lows,
price
){

let supports=[];
let resistances=[];

let start=
Math.max(2,highs.length-60);

for(
let i=start;
i<highs.length-1;
i++
){

let h=highs[i];
let l=lows[i];

if(
l<price&&
l<=lows[i-1]&&
l<=lows[i+1]
)
supports.push(l);

if(
h>price&&
h>=highs[i-1]&&
h>=highs[i+1]
)
resistances.push(h);

}

function uniqueLevels(
arr,
nearestFirst
){

arr.sort(
nearestFirst
?(a,b)=>
Math.abs(a-price)-
Math.abs(b-price)
:(a,b)=>b-a
);

let out=[];

for(let x of arr){

if(
!out.some(
y=>Math.abs(x-y)/y<0.008
)
)
out.push(x);

if(out.length>=4)
break;

}

return out;

}

let s=
uniqueLevels(
supports,
true
);

let rr=
uniqueLevels(
resistances,
true
);

let s1=
s.find(x=>x<price)
??Math.min(...lows.slice(-20));

let s2=
s.find(x=>x<s1*0.992)
??Math.min(...lows.slice(-40));

let r1=
rr.find(x=>x>price)
??Math.max(...highs.slice(-20));

let r2=
rr.find(x=>x>r1*1.008)
??Math.max(...highs.slice(-40));

return{
s1,
s2,
r1,
r2
};

}

let levels=
findSupportResistance(
high,
low,
price
);

let s1=levels.s1;
let s2=levels.s2;
let r1=levels.r1;
let r2=levels.r2;

let risk=50;
let reasons=[];

if(
price>ma5&&
price>ma10&&
price>ma20
){

risk-=12;

reasons.push(
"股價站在短中期均線之上"
);

}else if(
price<ma5&&
price<ma20
){

risk+=12;

reasons.push(
"股價位於短中期均線下方"
);

}

if(r>75){

risk+=12;

reasons.push(
"RSI偏熱，短線追價風險增加"
);

}else if(r>=50){

risk-=5;

reasons.push(
"RSI維持多方區"
);

}else if(r<35){

risk+=5;

reasons.push(
"RSI偏弱"
);

}

if(m>0){

risk-=6;

reasons.push(
"MACD位於正值區"
);

}else{

risk+=6;

reasons.push(
"MACD位於負值區"
);

}

let vr=
v/avgv;

let indicator=
indicatorText(
r,
m,
k,
change,
vr
);

if(
vr>1.5&&
change>0
){

risk-=8;

reasons.push(
"上漲伴隨放量"
);

}else if(
vr>1.5&&
change<0
){

risk+=10;

reasons.push(
"下跌伴隨放量"
);

}

if(relative>5){

risk-=8;

reasons.push(
"股價相對10MA的強度優於大盤"
);

}else if(relative<-5){

risk+=8;

reasons.push(
"股價相對10MA的強度弱於大盤"
);

}

if(revenueYoy!=null){

if(revenueYoy>=10){

risk-=5;

reasons.push(
"最新月營收年增"
);

}else if(revenueYoy<=-10){

risk+=5;

reasons.push(
"最新月營收年減"
);

}

}

if(instTotal!=null){

if(instTotal>0){

risk-=3;

reasons.push(
"最新交易日三大法人合計買超"
);

}else if(instTotal<0){

risk+=3;

reasons.push(
"最新交易日三大法人合計賣超"
);

}

}

let dist=
(r1-price)/price*100;

let supportDist=
(price-s1)/price*100;

if(dist<2){

risk+=8;

reasons.push(
"目前接近第一壓力區"
);

}

if(supportDist<2){

risk+=5;

reasons.push(
"目前接近第一支撐，波動風險增加"
);

}

risk=
Math.max(
10,
Math.min(
90,
Math.round(risk)
)
);

let score=100-risk;

let level=
score>=65
?"● 低風險"
:score>=40
?"● 中等風險"
:"● 高風險";

let cls=
score>=65
?"low":
score>=40
?"high"
:"";

let trend=
price>ma5&&price>ma10&&price>ma20&&ma5>ma10&&ma10>ma20
?"多頭排列":
price>ma5&&price>ma10&&price>ma20
?"站上均線｜均線仍待轉強":
price<ma5&&price<ma10&&price<ma20&&ma5<ma10&&ma10<ma20
?"空頭排列":
price<ma20
?"均線下方｜偏弱":
"整理／等待確認";

let volumeState=
vr>1.5&&change>0
?"價漲量增":
vr>1.5&&change<0
?"價跌量增":
vr<0.7
?"量縮":
"正常";

let relativeState=
relative>=3
?"明顯強於大盤":
relative>0
?"略強於大盤":
relative<=-3
?"明顯弱於大盤":
"接近大盤";

$("name").textContent=
code+" "+(
names[code]||
sr.meta.shortName||
""
);

$("status").textContent=
"分析完成｜資料更新："+
new Date().toLocaleString("zh-TW");

$("app").innerHTML=`

<div class="grid">

<div class="card">

<div class="title">📌 個股行情</div>

<div class="big ${change>=0?"up":"down"}">
${fmt(price)}
</div>

<div class="${change>=0?"up":"down"}">
${change>=0?"▲":"▼"} ${pct(change)}
</div>

<div class="muted" style="margin-top:8px">
成交量：${Number(v).toLocaleString()} 股
</div>

</div>

<div class="card">

<div class="title">
📊 基本面／籌碼
</div>

<div class="rows">

<div class="row">
<span>最新月營收</span>
<b>
${

async function getChart(

range="6mo"
){

const u=
"https://taiwan-stock-api.p337531.workers.dev/chart?symbol="
+
encodeURIComponent(symbol);

const r=
await fetch(u);

if(!r.ok)
throw Error(
"後端行情資料暫時無法取得"
);

return r.json();

}
